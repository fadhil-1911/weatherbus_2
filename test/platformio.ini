[platformio]
default_envs = rtc_test
src_dir = .

[env]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:bme280_test]
build_src_filter =
    -<*>
    +<bme280_i2c/src/main.cpp>

lib_deps =
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit Unified Sensor@^1.1.15

[env:rtc_test]
build_src_filter =
    -<*>
    +<rtc_test/src/main.cpp>

lib_deps =
    adafruit/RTClib@^2.1.4

[env:sht41_test]
build_src_filter =
    -<*>
    +<sht41_test/src/main.cpp>